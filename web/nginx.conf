worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
    server_tokens off;
    # Limite les requetes Status et les connexions pour contenir les abus locaux.
    limit_req_zone $binary_remote_addr zone=status_limit:1m rate=2r/s;
    limit_conn_zone $binary_remote_addr zone=connections:1m;
    client_header_timeout 10s;
    client_body_timeout 10s;
    send_timeout 10s;
    include /etc/nginx/mime.types;
    access_log /dev/stdout;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    resolver 127.0.0.11 valid=10s ipv6=off;
    # Pool partage : repartition entre les replicas API et suivi du DNS Docker.
    upstream api_pool {
        zone api_pool 64k;
        server api:5000 resolve;
    }
    server {
        limit_conn connections 20;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
        listen 8080;
        server_name localhost;
        root /var/www/html;
        index index.html;
        location = /health { default_type text/plain; return 200 'ok'; }
        location / { try_files $uri $uri/ =404; }
        location /api/ {
            limit_req zone=status_limit burst=8 nodelay;
            limit_req_status 429;
            proxy_pass http://api_pool;
            proxy_connect_timeout 3s;
            proxy_read_timeout 5s;
        }
    }
}
